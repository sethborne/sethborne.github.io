<!-- Card art for Form: a clipboard with a map pin.
     Used as a CSS mask (card.css): shapes only, color from the accent token.
     The pin sits over the clipboard's right edge, so the clipboard is cut
     away in a pin-shaped gap (the "gap" mask), and its edge never shows
     through the pin's hole. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <defs>
    <mask id="gap">
      <rect width="160" height="100" fill="#fff"/>
      <!-- the pin's outline, solid; stroke-width = the gap x 2 (1.5, like the review tool) -->
      <path d="M110,56 a12,12 0 0 1 12,12 c0,9 -12,21 -12,21 c0,0 -12,-12 -12,-21 a12,12 0 0 1 12,-12 z" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="50" y="15" width="58" height="74" rx="5" fill="none" stroke="#000" stroke-width="3" mask="url(#gap)"/>
  <rect x="67" y="10" width="24" height="11" rx="3"/>
  <g opacity="0.55">
    <rect x="60" y="32" width="8" height="8" rx="1.5" fill="none" stroke="#000" stroke-width="2"/>
    <rect x="73" y="34.5" width="26" height="3" rx="1.5"/>
    <rect x="60" y="48" width="8" height="8" rx="1.5" fill="none" stroke="#000" stroke-width="2"/>
    <rect x="73" y="50.5" width="22" height="3" rx="1.5"/>
    <rect x="60" y="64" width="8" height="8" rx="1.5" fill="none" stroke="#000" stroke-width="2"/>
    <rect x="73" y="66.5" width="14" height="3" rx="1.5"/>
  </g>
  <path fill-rule="evenodd" d="M110,56 a12,12 0 0 1 12,12 c0,9 -12,21 -12,21 c0,0 -12,-12 -12,-21 a12,12 0 0 1 12,-12 z M110,63 a5,5 0 1 0 0.01,0 z"/>
</svg>
