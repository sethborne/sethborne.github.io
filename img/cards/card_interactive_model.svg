     with an orbit arrow around the plane's front, drawn on the ground:
     a circle seen at the grid's 2:1 angle, its head squashed the same way.
     Used as a CSS mask (card.css): only shapes and opacity matter, the
     color comes from the accent token.
     Faces: top solid, left 85%, right 60%; tiles alternate 45% / 25%.
     Each building cuts a 0.6-unit gap (the "gap" and "near" masks: the
     stroke-width is the gap x 2) into the tiles and into any building
     behind it, matching the tile gaps.
     Generated by _mockups/card-art/make_variants.py (model_b_5x5_thin);
     edit buildings there (tile x, tile y, height) and copy the result,
     or tweak this file by hand. -->
