  <rect x="24" y="20" width="46" height="58" rx="4" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="90" y="20" width="46" height="58" rx="4" fill="none" stroke="#000" stroke-width="3"/>
  <g opacity="0.55">
    <rect x="32" y="30" width="30" height="3" rx="1.5"/><rect x="32" y="40" width="24" height="3" rx="1.5"/><rect x="32" y="50" width="28" height="3" rx="1.5"/>
    <rect x="98" y="30" width="30" height="3" rx="1.5"/><rect x="98" y="40" width="24" height="3" rx="1.5"/><rect x="98" y="50" width="20" height="3" rx="1.5"/>
  </g>
  <circle cx="80" cy="76" r="13" fill="none" stroke="#000" stroke-width="3"/>
  <path d="M73.5,76.5 L78,81 L86.5,71.5" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
