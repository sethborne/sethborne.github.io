<!-- Card art for Data Pipeline: records falling into a funnel, out into a table.
     Used as a CSS mask (card.css): shapes only, color from the accent token.
     The funnel spans the table's height (y 26 to 80), so the two read as one
     row; 36 units apart, the arrow centered in the gap
     (x 62 to 88, a bit thinner than the outlines) at y 54, at the top of the spout. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <g opacity="0.45">
    <rect x="20" y="12" width="9" height="6" rx="1.5"/>
    <rect x="36" y="8" width="9" height="6" rx="1.5"/>
    <rect x="50" y="13" width="9" height="6" rx="1.5"/>
  </g>
  <polygon points="14,26 66,26 48,50 48,80 32,80 32,50" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M62,54 H88 M83,49 L88,54 L83,59" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="102" y="26" width="46" height="54" rx="3" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="102" y="26" width="46" height="12"/>
  <path d="M102,52 H148 M102,66 H148 M124,38 V80" fill="none" stroke="#000" stroke-width="2" opacity="0.55"/>
</svg>
