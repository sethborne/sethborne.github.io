<!-- Card art for project (group) cards: the site icon (img/favicon/
     favicon.svg), map layers under a pin, scaled into the cards' 160x100
     box. Used as a CSS mask (card.css): only the shapes and their opacity
     matter, the color comes from the accent token. Keep in step with the
     favicon if it changes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
<defs>
<path id="pin" d="M16 16.6s-4.958 -5.23404 -4.958 -8.442a4.958 4.958 0 0 1 9.916 0c0 3.20796 -4.958 8.442 -4.958 8.442z"/>
<path id="dTop" d="M7.43 17.5L16 13.21L24.57 17.5L16 21.79z"/>
<path id="dMid" d="M7.43 20.9L16 16.61L24.57 20.9L16 25.18z"/>
<mask id="mPin" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><use href="#pin" fill="#000" stroke="#000" stroke-width="1.3"/></mask>
<mask id="mTop" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><use href="#dTop" fill="#000"/></mask>
<mask id="mMid" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><use href="#dMid" fill="#000"/></mask>
<mask id="mHole" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><circle cx="16" cy="8.16" r="2.08" fill="#000"/></mask>
</defs>
<!-- 32x32 icon at 3.3x, its drawing (y 3.2 to 28.9) centered in 160x100 -->
<g transform="translate(27.20 -2.97) scale(3.3)">
<g mask="url(#mPin)">
 <g mask="url(#mTop)">
  <g mask="url(#mMid)">
   <path d="M6.93 17.5V24.3M25.07 17.5V24.3" stroke="#000" stroke-width="0.2" stroke-dasharray="0.62 0.62" opacity=".55"/>
   <path d="M7.43 24.3L16 20.02L24.57 24.3L16 28.59z" fill="#000" fill-opacity=".06" stroke="#000" stroke-opacity="0.2" stroke-width="0.45"/>
  </g>
  <use href="#dMid" fill="#000" fill-opacity=".1" stroke="#000" stroke-opacity="0.45" stroke-width="0.45"/>
 </g>
 <g transform="matrix(2.55 1.275 -2.55 1.275 16 13.68)" fill="#000">
  <rect x="0.07" y="0.07" width=".86" height=".86" opacity="0.7"/><rect x="1.07" y="0.07" width=".86" height=".86" opacity="0.4"/><rect x="2.07" y="0.07" width=".86" height=".86" opacity="0.7"/>
  <rect x="0.07" y="1.07" width=".86" height=".86" opacity="0.4"/><rect x="1.07" y="1.07" width=".86" height=".86"/><rect x="2.07" y="1.07" width=".86" height=".86" opacity="0.4"/>
  <rect x="0.07" y="2.07" width=".86" height=".86" opacity="0.7"/><rect x="1.07" y="2.07" width=".86" height=".86" opacity="0.4"/><rect x="2.07" y="2.07" width=".86" height=".86" opacity="0.7"/>
 </g>
 <use href="#dTop" fill="none" stroke="#000" stroke-opacity="0.75" stroke-width="0.45"/>
 <path d="M16 22.04V28.84" stroke="#000" stroke-width="0.2" stroke-dasharray="0.62 0.62" opacity=".55"/>
</g>
<use href="#pin" fill="#000" mask="url(#mHole)"/>
</g>
</svg>
