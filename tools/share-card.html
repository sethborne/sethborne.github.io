<!doctype html>
<!--
  Share card source: the 1200x630 image link previews show (og:image).
  Not part of the site. To export:
  1. Open this page with Live Server
  2. DevTools > device toolbar: Responsive, 1200 x 630, DPR 1
  3. DevTools menu (⋮) > Capture screenshot
  4. Save as JPG: img/meta/meta_share_1200.jpg
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Share card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Tokens + the portrait's tone classes, nothing else from the site -->
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../components/about/about.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
      }

      .card {
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 64px;
        padding: 0 80px;
        border-bottom: 10px solid var(--accent);
        overflow: hidden;
      }

      .eyebrow {
        font-family: var(--font-mono);
        font-size: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }

      h1 {
        margin: 16px 0 0;
        font-family: var(--font-display);
        font-size: 92px;
        line-height: 1;
        color: var(--ink);
      }

      .tagline {
        margin: 24px 0 0;
        font-family: var(--font-body);
        font-size: 30px;
        line-height: 1.35;
        color: var(--text);
      }

      .url {
        display: block;
        margin-top: 40px;
        font-family: var(--font-mono);
        font-size: 24px;
        color: var(--accent);
      }

      /* Same sizing trick as the About box: a size container, so the
         font fits the widest line to this width */
      .portrait {
        width: 460px;
        container-type: inline-size;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <span class="eyebrow">Portfolio</span>
        <h1>Seth Borne</h1>
        <p class="tagline">
          Web developer building GIS tools: Survey123 and Experience
          Builder apps, web maps, and data pipelines.
        </p>
        <span class="url">sethborne.github.io</span>
      </div>
      <div class="portrait" id="portrait"></div>
    </div>

    <script type="module">
      import {renderAscii} from '../components/about/about.js';
      import about from '../content/about.js';

      // Paths in about.js are relative to the site root, this page is
      // one folder down
      const up = (path) => path && `../${path}`;
      const {ascii, cutout, alt} = about.photo;
      document
        .getElementById('portrait')
        .append(renderAscii({ascii: up(ascii), cutout: up(cutout), alt}));
    </script>
  </body>
</html>
