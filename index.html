<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Seth Borne | Web developer building GIS tools</title>
    <meta
      name="description"
      content="Web developer building GIS tools: Survey123 and Experience Builder apps, web maps, and the data pipelines behind them."
    />
    <link rel="canonical" href="https://sethborne.github.io/" />

    <!-- Link previews (LinkedIn, Slack, X...). Scrapers don't run JS or
         read past the #, so every link to the site shows this one card.
         URLs must be absolute. Share image: tools/share-card.html -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seth Borne" />
    <meta
      property="og:title"
      content="Seth Borne | Web developer building GIS tools"
    />
    <meta
      property="og:description"
      content="Web developer building GIS tools: Survey123 and Experience Builder apps, web maps, and the data pipelines behind them."
    />
    <meta property="og:url" content="https://sethborne.github.io/" />
    <meta
      property="og:image"
      content="https://sethborne.github.io/img/meta/meta_share_1200.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="629" />
    <meta
      property="og:image:alt"
      content="Seth Borne, web developer building GIS tools, beside an ASCII art portrait"
    />
    <!-- X reads the og: tags for everything else -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- No JS: hide the first-load spinner (see components/loader/) -->
    <noscript
      ><style>
        #loader {
          display: none;
        }
      </style></noscript
    >
    <link rel="icon" href="./img/favicon/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      href="./img/favicon/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="./img/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="./img/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- FIRST-LOAD SPINNER: hidden by components/loader/loader.js -->
    <div id="loader" class="loader" role="status" aria-live="polite">
      <span class="loader-ring" aria-hidden="true"></span>
      <span class="loader-text">Loading</span>
    </div>

    <!-- HEADER: filled by components/header/header.js -->
    <header class="nav" id="siteNav"></header>

    <!-- MAIN: app.js shows one view at a time, home or page -->
    <main>
      <!-- HOME VIEW: hero + sections, shown on #/ and section routes -->
      <div id="homeView">
        <!-- HERO: filled by components/hero/hero.js (id watched by the header) -->
        <section class="hero" id="home"></section>

        <!-- PROJECTS -->
        <section class="section" id="projects">
          <div class="container">
            <div class="section-head">
              <span class="eyebrow">Selected work</span>
              <h2>Projects</h2>
              <p>
                GIS maps, applications and data pipelines, plus
                visualization and web development work.
              </p>
            </div>

            <!-- Filter bar + cards: filled by components/projects/projects.js -->
            <div id="projectsBody"></div>
          </div>
        </section>

        <!-- ABOUT & CONTACT: filled by components/about/about.js (id watched by the header) -->
        <section class="section section-soft" id="about"></section>
      </div>

      <!-- PAGE VIEW: filled by components/page/page.js on node routes -->
      <div id="pageView" hidden></div>
    </main>

    <!-- FOOTER: filled by components/footer/footer.js -->
    <footer class="footer" id="siteFooter"></footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
