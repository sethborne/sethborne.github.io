<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Seth Borne — GIS &amp; Web Developer | Web Engineer</title>
    <meta
      name="description"
      content="Seth Borne. Web developer building spatial tools, data pipelines, and GIS applications."
    />
    <link
      rel="icon"
      href="img/icon/favicon.ico"
      type="image/x-icon"
    />
    <!-- No JS: hide the first-load spinner (see components/loader/) -->
    <noscript
      ><style>
        #loader {
          display: none;
        }
      </style></noscript
    >
    <link rel="icon" href="./img/favicon/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      href="./img/favicon/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="./img/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="./img/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- FIRST-LOAD SPINNER: hidden by components/loader/loader.js -->
    <div id="loader" class="loader" role="status" aria-live="polite">
      <span class="loader-ring" aria-hidden="true"></span>
      <span class="loader-text">Loading</span>
    </div>

    <!-- HEADER: filled by components/header/header.js -->
    <header class="nav" id="siteNav"></header>

    <!-- MAIN: app.js shows one view at a time, home or page -->
    <main>
      <!-- HOME VIEW: hero + sections, shown on #/ and section routes -->
      <div id="homeView">
        <!-- HERO: filled by components/hero/hero.js (id watched by the header) -->
        <section class="hero" id="home"></section>

        <!-- PROJECTS -->
        <section class="section" id="projects">
          <div class="container">
            <div class="section-head">
              <span class="eyebrow">Selected work</span>
              <h2>Projects</h2>
              <p>
                GIS maps, applications and data pipelines, plus
                visualization and web development work.
              </p>
            </div>

            <!-- Group cards: filled by app.js from content/site.js -->
            <div id="projectGrid"></div>
          </div>
        </section>
      </div>

      <!-- PAGE VIEW: filled by components/page/page.js on node routes -->
      <div id="pageView" hidden></div>
    </main>

    <!-- FOOTER: filled by components/footer/footer.js -->
    <footer class="footer" id="siteFooter"></footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
